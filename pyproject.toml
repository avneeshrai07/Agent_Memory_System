[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-verse-avneesh"
version = "0.6.0"
description = "Persistent, fast, accurate memory layer for conversational LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avneesh Rai" }]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "pgvector>=0.2"]
redis = ["redis>=5.0"]
upstash = ["upstash-redis>=1.0"]
bedrock = ["boto3>=1.34"]
all = ["memory-verse-avneesh[postgres,redis,upstash,bedrock]"]
dev = ["memory-verse-avneesh[all]", "pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_verse_avneesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
